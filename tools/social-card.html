<!doctype html>
<html lang="es-MX">
    <head>
        <meta charset="utf-8">
        <title>Tarjeta social de AIDEX</title>
        <style>
            @font-face {
                font-family: Manrope;
                src: url('../public/assets/fonts/manrope-extrabold.ttf');
                font-weight: 800;
            }
            * {
                box-sizing: border-box;
            }
            body {
                width: 1200px;
                height: 630px;
                padding: 60px 76px;
                margin: 0;
                font-family: Manrope, sans-serif;
                background: radial-gradient(ellipse at 90% 50%, #1a5556, transparent 55%), #0b2233;
                color: white;
            }
            img {
                width: 580px;
                height: auto;
                margin-left: -14px;
            }
            h1 {
                margin: 56px 0 24px;
                font-size: 70px;
                line-height: 1.15;
                letter-spacing: -3px;
            }
            span {
                color: #81e1ce;
            }
            p {
                font-size: 20px;
                color: #c5d8df;
            }
        </style>
    </head>
    <body>
        <img src="../public/assets/img/logo-dark-h.svg" alt="AIDEX">
        <h1>Tus expedientes en orden.<br><span>Tu información a la mano.</span></h1>
        <p>Organiza. Encuentra. Mantén el control.</p>
    </body>
</html>
