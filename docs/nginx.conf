# Guardar como /etc/nginx/sites-available/aidex.
# Este bloque inicial permite emitir el certificado con Certbot (ver README).
# Antes de producción, habilitar HTTPS y redirección desde HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name aidex.com.mx www.aidex.com.mx;

    root /var/www/aidex/sitio/public;
    index index.php;
    charset utf-8;
    autoindex off;
    server_tokens off;
    client_max_body_size 20k;

    access_log /var/log/nginx/aidex-access.log;
    error_log /var/log/nginx/aidex-error.log;

    location = /robots.txt {
        rewrite ^ /robots.php last;
    }

    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Solo estos puntos de entrada públicos pueden ejecutar PHP.
    location ~ ^/(index|contact|robots|sitemap)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
}
